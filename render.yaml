databases:
  - name: task-dashboard-mongodb
    databaseName: taskmanager
    user: taskuser
    plan: starter

services:
  # Backend API Service
  - type: web
    name: task-dashboard-backend
    env: node
    plan: starter
    buildCommand: npm ci --only=production
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: task-dashboard-mongodb
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://task-dashboard-frontend.onrender.com,http://localhost:3000,http://localhost:5173
      - key: FRONTEND_URL
        value: https://task-dashboard-frontend.onrender.com
      - key: MAX_FILE_SIZE
        value: 10485760

  # Frontend Static Site
  - type: web
    name: task-dashboard-frontend
    env: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://task-dashboard-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
